// The loader-agnostic half of a mod. It compiles against plain Minecraft (NeoForm, no loader), so any
// accidental use of a Fabric or NeoForge API fails right here. Nothing is ever shipped from this
// project: the fabric and neoforge projects compile these same sources into their own jars.
//
// Two source sets, same split as Fabric's: src/main for code that runs everywhere and src/client for
// code that may only run on the physical client (screens, key handling, rendering).
plugins {
	id 'spacebod.base'
	id 'net.neoforged.moddev'
}

sourceSets {
	client {
		compileClasspath += main.output
		runtimeClasspath += main.output
	}
}

// Exposed as the "client" feature so the loader projects' IDE modules can see these classes too.
java {
	registerFeature('client') {
		usingSourceSet(sourceSets.client)
	}
}

neoForge {
	// NeoForm = vanilla Minecraft set up for compiling, with no loader on top.
	neoFormVersion = project.neo_form_version
	addModdingDependenciesTo(sourceSets.client)
}

configurations {
	clientCompileOnly.extendsFrom compileOnly
}

dependencies {
	// Both Fabric Loader and NeoForge ship Sponge Mixin and MixinExtras at runtime, so common code
	// can use them freely. These versions only need to be API-compatible with what the loaders bundle.
	compileOnly 'net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7'
	compileOnly 'io.github.llamalad7:mixinextras-common:0.5.5'
}

markLoader('common', ['clientApiElements', 'clientRuntimeElements'])
