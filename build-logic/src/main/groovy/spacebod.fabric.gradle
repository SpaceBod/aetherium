// The Fabric jar: fabric/src (entrypoints, fabric.mod.json) compiled together with the shared common/src sources.
plugins {
	id 'spacebod.base'
	id 'net.fabricmc.fabric-loom'
}

version = "${project.mod_version}+mc${mcSeries}-fabric"

loom {
	splitEnvironmentSourceSets()

	mods {
		"${project.mod_id}" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// Loom only makes IDE run configs for the root project by default; fabric/ is a subproject.
		configureEach {
			ideConfigGenerated(true)
			runDir runDirName
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Required by the mod metadata, so dev runs need it on the classpath too.
	runtimeOnly "maven.modrinth:sodium:${project.sodium_version}-fabric"

	// Only so the IDE sees common's classes; the sources themselves are compiled in below.
	compileOnly(project(':common')) {
		attributes { attribute(loaderAttribute, 'common') }
	}
	clientCompileOnly(project(':common')) {
		attributes { attribute(loaderAttribute, 'common') }
		capabilities { requireFeature('client') }
	}
}

tasks.named('compileJava', JavaCompile) { source(commonSrc('main', 'java')) }
tasks.named('compileClientJava', JavaCompile) { source(commonSrc('client', 'java')) }
tasks.named('processResources', ProcessResources) { from(commonSrc('main', 'resources')) }
tasks.named('processClientResources', ProcessResources) { from(commonSrc('client', 'resources')) }
tasks.named('sourcesJar', Jar) {
	from(commonSrc('main', 'java') + commonSrc('client', 'java'))
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
	def version = project.version
	// ">=26.3- <26.4-": the trailing hyphens make Fabric Loader include pre-releases, so a jar built
	// for a series also loads on that series' snapshots/RCs and on every patch release within it.
	def minecraftRange = ">=${mcSeries}- <${mcNextSeries}-"
	def loaderVersion = project.loader_version
	def sodiumMin = project.sodium_min
	// The Fabric API release built against, without its "+<minecraft>" build suffix (Loader ignores build metadata).
	def fabricApiMin = project.fabric_api_version.split('\\+')[0]
	inputs.property 'version', version
	inputs.property 'minecraftRange', minecraftRange
	inputs.property 'loaderVersion', loaderVersion
	inputs.property 'sodiumMin', sodiumMin
	inputs.property 'fabricApiMin', fabricApiMin

	filesMatching('fabric.mod.json') {
		expand 'version': version, 'minecraft_range': minecraftRange, 'loader_version': loaderVersion, 'sodium_min': sodiumMin, 'fabric_api_min': fabricApiMin
	}
}

markLoader('fabric', ['includeInternal', 'modCompileClasspath'])
