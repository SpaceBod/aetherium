# Uploads each published GitHub release's jars to CurseForge (scripts/curseforge-upload.sh). Pre-releases are skipped.
# Run it by hand from the Actions tab for a given tag; a dry run (the default there) shows what would be uploaded.
# Needs the repository secret CURSEFORGE_TOKEN.
name: CurseForge upload

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload (e.g. v0.1.2)
        required: true
      dry_run:
        description: Only show what would be uploaded
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: curseforge-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  upload:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            bash scripts/curseforge-upload.sh "$TAG" --dry-run
          else
            bash scripts/curseforge-upload.sh "$TAG"
          fi
