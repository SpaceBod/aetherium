org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Mod
mod_id=aetherium
mod_version=0.1.0
group=dev.spacebod

# Minecraft: 26.3 only.
minecraft_version=26.3
# Vanilla Minecraft for compiling common/: https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric: https://fabricmc.net/develop
loader_version=0.19.5
fabric_api_version=0.161.0+26.3

# NeoForge: https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.3.0.23-beta

# Terrain-renderer mod, required at runtime (Modrinth project "sodium"). sodium_version is its Modrinth version
# number without the loader suffix, used for dev runs; sodium_min is the lowest version the mod metadata accepts.
sodium_version=mc26.3-0.9.3-alpha.1
sodium_min=0.9.2
